[package]
name = "cadcraft-dwg"
description = "CADCraft DWG bridge: converts DWG to and from DXF bytes using the acadrust crate (MPL-2.0, used unmodified)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# MPL-2.0: used as an unmodified dependency only (see plan/adr/0001 and NOTICE). acadrust gates
# its own memmap2 and rayon to non-wasm targets, and its reader and writer work on streams, so it
# builds for the web too — which is what opens DWG files in the browser.
acadrust = "0.6.5"
