# CADCraft in one image: nginx serves the browser build and the same image carries the headless
# cadcraft-cli (info, convert, run, commands, perf, sample, and MCP over stdio). packaging/docker/
# Dockerfile builds it from the repository alone; nothing comes from a registry, and there is no
# server-side code.
#
#   docker compose -f packaging/docker/compose.yaml up --build --wait    # then open the URL below
#   docker compose -f packaging/docker/compose.yaml down
#
# CADCRAFT_WEB_PORT  host port to publish (default 8771, the port `trunk serve` uses)
#
# nginx/default.conf is the nginx form of the requirements in packaging/web/README.md and is baked
# into the image. Note the HTTPS one: WebGPU and the clipboard need a secure context, so
# http://localhost is fine while a plain-HTTP LAN address serves the app with the WebGL2 fallback.
#
# The CLI (and the stdio MCP server) is a command on the same image rather than a second service.
# Reach it through this one, e.g. `docker compose run --rm web info /work/plan.dxf`. See README.md
# in this directory.
name: cadcraft

services:
  web:
    build:
      # The repository root: the wasm build and `cargo build -p cadcraft-cli` need the workspace
      # manifests and the crate sources (see .dockerignore).
      context: ../..
      dockerfile: packaging/docker/Dockerfile
    image: cadcraft
    restart: unless-stopped
    ports:
      - "${CADCRAFT_WEB_PORT:-8771}:80"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1/"]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 2s
    # nginx only reads files here: keep the container filesystem read-only and give it just the two
    # writable directories it needs (its pid file and its cache).
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - "no-new-privileges:true"
