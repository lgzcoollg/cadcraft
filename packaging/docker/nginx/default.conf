# Static hosting for the CADCraft web build: the server settings packaging/web/README.md requires.
# packaging/docker/Dockerfile copies this file into the image at /etc/nginx/conf.d/; on any other
# nginx, drop it into conf.d/ (or include it from a server block) and point `root` at the site.
#
# No Content-Security-Policy is sent. Note the HTTPS rule from that README: WebGPU and the clipboard
# only work in a secure context, so http://localhost is fine while a plain-HTTP LAN address such as
# http://192.168.1.5:8771 serves the app with the WebGL2 fallback.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;

    # The .wasm is about 13 MiB of code and compresses to roughly a third. text/html is always
    # compressed, and listing it here would only make nginx log "duplicate MIME type" at startup.
    gzip on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types application/wasm text/javascript text/css application/json image/svg+xml;

    # Browsers refuse to stream-compile a .wasm served as anything but application/wasm, and this
    # nginx (1.28) still maps .js to the deprecated application/javascript. Both locations declare
    # their type outright instead of inheriting one. Asset names carry a content hash, so they can
    # be cached forever; the page that points at them (below) cannot.
    location ~* \.wasm$ {
        types {
            application/wasm wasm;
        }
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ~* \.js$ {
        types {
            text/javascript js;
        }
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # A new release changes this file and nothing else it points at, so it has to be revalidated.
    location = /index.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-cache" always;
    }
}
